name: Validate LiveKit unit tests on Python 3.12 and 3.14

on:
  push:
    branches: [validation-livekit-python314-7b1e0386]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      EXPECTED_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON: ${{ matrix.python-version }}
      UV_LOCKED: "1"
      UV_NO_CACHE: "1"
      SOURCE_COMMIT: 0a928dd71a0aef07b6626fb0f147e6d792a082cd
      SOURCE_TREE: 6bc1452af627cec10c48e1b66b66cb6a689a5f39
    steps:
      - name: Checkout exact upstream source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: livekit/agents
          ref: 0a928dd71a0aef07b6626fb0f147e6d792a082cd
          persist-credentials: false
          path: exact-source
      - name: Assert source repository, commit, tree and tracked bytes
        working-directory: exact-source
        run: |
          test "$(git config --get remote.origin.url)" = "https://github.com/livekit/agents"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git diff HEAD --exit-code
          printf 'source=%s tree=%s event=%s\n' "$SOURCE_COMMIT" "$SOURCE_TREE" "$GITHUB_SHA"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install documented project dependencies from its lockfile
        working-directory: exact-source
        run: |
          uv sync --locked --all-extras --dev
          uv run --no-sync python -c 'import sys; expected = tuple(map(int, sys.argv[1].split("."))); print(sys.version); assert sys.version_info[:2] == expected' "$EXPECTED_PYTHON"
          git diff HEAD --exit-code
      - name: Download NLTK data as in upstream CI
        working-directory: exact-source
        run: uv run python -c "import nltk; assert nltk.download('punkt_tab', raise_on_error=True)"
      - name: Run the upstream unit entry point without provider credentials
        working-directory: exact-source
        run: make unit-tests
      - name: Verify exact source and tracked bytes after all steps
        if: ${{ always() }}
        working-directory: exact-source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git diff HEAD --exit-code
